<div class="card">
  <div class="card-title" style="display:flex; justify-content:space-between; align-items:center;">
    <span>AI Chat Assistant</span>
    
    <div style="display:flex; gap:10px; align-items:center;">
      <span style="font-size:12px; color:var(--text-muted);">Active Project:</span>
      <select [ngModel]="selectedProjectCode" (ngModelChange)="onProjectChange($event)" style="background:var(--bg-dark); border:1px solid var(--card-border); color:#fff; padding:6px 12px; border-radius:6px; font-weight:600; cursor:pointer;">
        <option *ngFor="let p of projectsList" [value]="p">{{ p }} - {{ p === 'PRJ-001' ? 'Orion' : p === 'PRJ-002' ? 'Pegasus' : p === 'PRJ-003' ? 'Identity' : p === 'PRJ-004' ? 'Migration' : 'Analytics' }}</option>
      </select>
    </div>
  </div>
  
  <div style="display:flex; gap:10px; margin-bottom:16px; margin-top:12px;">
    <input type="text" [(ngModel)]="userQuery" (keyup.enter)="sendQuery()" style="flex:1; background:var(--bg-dark); border:1px solid var(--card-border); color:#fff; padding:10px 14px; border-radius:6px; font-size:14px;" placeholder="Ask any question about your projects, risks, or program health...">
    <button class="btn btn-primary" (click)="sendQuery()" style="background:linear-gradient(135deg, #0284c7 0%, #0369a1 100%); padding:10px 20px; font-weight:bold;">Send</button>
  </div>

  <div style="background:var(--bg-dark); border:1px solid var(--card-border); padding:18px; border-radius:8px; min-height:220px;">
    <div style="color:var(--success); font-weight:bold; font-size:13px; margin-bottom:8px; display:flex; align-items:center; gap:6px;">
      <span>🤖 AI Assistant Response (Active Project: {{ selectedProjectCode }})</span>
    </div>
    <div style="color:#e2e8f0; font-size:14px; line-height:1.6; white-space:pre-wrap;">{{ chatResponse || 'Type a query above and click Send to chat with the AI Assistant...' }}</div>
  </div>
</div>
